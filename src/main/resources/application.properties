quarkus.datasource.db-kind=${JOBRAIL_DATABASE:postgresql}
quarkus.datasource.username=${JOBRAIL_DATASOURCE_USERNAME:jobrail}
quarkus.datasource.password=${JOBRAIL_DATASOURCE_PASSWORD:jobrail}
quarkus.datasource.jdbc.url=${JOBRAIL_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobrail-dev}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.locations=database/migrations

quarkus.index-dependency.mapstruct.group-id=org.mapstruct

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/jobrail-test
%test.quarkus.datasource.username=jobrail
%test.quarkus.datasource.password=jobrail
%test.quarkus.flyway.clean-at-start=true