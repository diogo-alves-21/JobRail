quarkus.datasource.db-kind=${JOBRAIL_DATABASE:postgresql}
quarkus.datasource.username=${JOBRAIL_DATASOURCE_USERNAME:jobrail}
quarkus.datasource.password=${JOBRAIL_DATASOURCE_PASSWORD:jobrail}
quarkus.datasource.jdbc.url=${JOBRAIL_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobrail-dev}

quarkus.http.port=${PORT:8080}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.locations=database/migrations

quarkus.index-dependency.mapstruct.group-id=org.mapstruct

quarkus.swagger-ui.always-include=true

%test.quarkus.datasource.jdbc.url=${JOBRAIL_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/jobrail-test}
%test.quarkus.datasource.username=${JOBRAIL_TEST_DATASOURCE_USERNAME:jobrail}
%test.quarkus.datasource.password=${JOBRAIL_TEST_DATASOURCE_PASSWORD:jobrail}
%test.quarkus.scheduler.enabled=false
%test.quarkus.flyway.clean-at-start=true

jobrail.workers.count=4
jobrail.workers.poll-interval=1s
jobrail.workers.reclaim-interval=30s

%test.jobrail.workers.enabled=false
