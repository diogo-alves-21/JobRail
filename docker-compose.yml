services:
  jobrail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobrail
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      JOBRAIL_DATABASE: ${JOBRAIL_DATABASE}
      JOBRAIL_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${JOBRAIL_DATASOURCE_DB}
      JOBRAIL_DATASOURCE_USERNAME: ${JOBRAIL_DATASOURCE_USERNAME}
      JOBRAIL_DATASOURCE_PASSWORD: ${JOBRAIL_DATASOURCE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 &&printf 'GET /q/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:16
    container_name: jobrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOBRAIL_DATASOURCE_DB}
      POSTGRES_USER: ${JOBRAIL_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${JOBRAIL_DATASOURCE_PASSWORD}
    ports:
      - "${JOBRAIL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBRAIL_DATASOURCE_USERNAME} -d ${JOBRAIL_DATASOURCE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16
    container_name: jobrail-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: jobrail-test
      POSTGRES_USER: ${JOBRAIL_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${JOBRAIL_TEST_DATASOURCE_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBRAIL_DATASOURCE_USERNAME} -d jobrail-test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
